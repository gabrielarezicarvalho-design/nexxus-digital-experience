# /etc/nginx/sites-available/nexa  (depois: ln -s ../sites-available/nexa /etc/nginx/sites-enabled/)
# Pega o IP real do cliente vindo da Cloudflare e repassa como CF-Connecting-IP confiável.
# Faixas da Cloudflare: https://www.cloudflare.com/ips/ (atualizar se mudarem)
set_real_ip_from 173.245.48.0/20;  set_real_ip_from 103.21.244.0/22;  set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;    set_real_ip_from 141.101.64.0/18;  set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;  set_real_ip_from 188.114.96.0/20;  set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;  set_real_ip_from 162.158.0.0/15;   set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;    set_real_ip_from 172.64.0.0/13;    set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;   set_real_ip_from 2606:4700::/32;   set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;   set_real_ip_from 2405:8100::/32;   set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Site (novo domínio + domínio antigo e domínios de revenda, que continuam funcionando para quem já usa)
server {
  listen 443 ssl;
  server_name cloudnexa.com.br www.cloudnexa.com.br cloudnexapro.site www.cloudnexapro.site apirevenda.site apiclaude.site fbias.site;
  ssl_certificate     /etc/letsencrypt/live/cloudnexa.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cloudnexa.com.br/privkey.pem;
  client_max_body_size 50m;
  location / { include /etc/nginx/snippets/nexa-proxy.conf; }
}

# Base URL dos clientes: https://api.cloudnexa.com.br (Anthropic) e https://api.cloudnexa.com.br/v1 (OpenAI)
server {
  listen 443 ssl;
  server_name api.cloudnexa.com.br;
  ssl_certificate     /etc/letsencrypt/live/cloudnexa.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cloudnexa.com.br/privkey.pem;
  client_max_body_size 50m;
  location / {
    rewrite ^/(.*)$ /api/public/$1 break;
    include /etc/nginx/snippets/nexa-proxy.conf;
  }
}

# API pública do Supabase (login e dados do navegador)
server {
  listen 443 ssl;
  server_name db.cloudnexa.com.br;
  ssl_certificate     /etc/letsencrypt/live/cloudnexa.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cloudnexa.com.br/privkey.pem;
  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
  }
}

server {
  listen 80;
  server_name cloudnexa.com.br www.cloudnexa.com.br api.cloudnexa.com.br db.cloudnexa.com.br cloudnexapro.site www.cloudnexapro.site apirevenda.site apiclaude.site fbias.site;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}
