# Etapa 1 (antes da troca): só api.cloudnexa.com.br e db.cloudnexa.com.br.
# Instalar:  cp deploy/nginx-nexa-proxy.conf /etc/nginx/snippets/nexa-proxy.conf
#            cp deploy/nginx-etapa1.conf /etc/nginx/sites-available/nexa && ln -sf ../sites-available/nexa /etc/nginx/sites-enabled/nexa
#            nginx -t && systemctl reload nginx && certbot --nginx -d api.cloudnexa.com.br -d db.cloudnexa.com.br
server {
  listen 80;
  server_name api.cloudnexa.com.br;
  client_max_body_size 50m;
  location / {
    rewrite ^/(.*)$ /api/public/$1 break;
    include /etc/nginx/snippets/nexa-proxy.conf;
  }
}

server {
  listen 80;
  server_name db.cloudnexa.com.br;
  location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
  }
}
