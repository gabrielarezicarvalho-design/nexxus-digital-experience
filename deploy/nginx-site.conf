# Site novo: cloudnexa.com.br e www (os domínios do site antigo NÃO apontam para esta VPS).
# Instalar: cp deploy/nginx-site.conf /etc/nginx/sites-available/nexa-site && ln -sf ../sites-available/nexa-site /etc/nginx/sites-enabled/nexa-site
#           nginx -t && systemctl reload nginx && certbot --nginx -d cloudnexa.com.br -d www.cloudnexa.com.br --redirect
server {
  listen 80;
  server_name cloudnexa.com.br www.cloudnexa.com.br;
  client_max_body_size 50m;
  # Imagens que na Lovable vinham do CDN dela (baixadas com deploy/baixar-imagens.sh)
  location /__l5e/assets-v1/ { alias /var/www/nexa-assets/; expires 30d; }
  location / { include /etc/nginx/snippets/nexa-proxy.conf; }
}
